<div class="wrap">
  <header class="top">
    <div>
      <h1>Buku Kelas</h1>

  </header>
  <nav id="classbar" class="classbar" aria-label="Daftar kelas"></nav>
  <main id="main"><div class="card"><span class="muted">Memuat buku kelas…</span></div></main>
</div>
<div id="toast" class="toast" role="status" hidden><span id="tmsg"></span><button id="tundo" hidden>Urungkan</button></div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var uid=function(p){return p+Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-3)};
var pad=function(n){return n<10?"0"+n:""+n};
var fmtDate=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var today=function(){return fmtDate(new Date())};
var addDays=function(s,n){var p=s.split("-").map(Number);return fmtDate(new Date(p[0],p[1]-1,p[2]+n))};
var longDate=function(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})};
var shortDate=function(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("id-ID",{day:"numeric",month:"short"})};
var n1=function(v){return v==null?"–":Number(v).toLocaleString("id-ID",{maximumFractionDigits:1})};
var clamp=function(v){return Math.max(0,Math.min(100,v))};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a};
var CODES=["H","S","I","A"], NAMES={H:"Hadir",S:"Sakit",I:"Izin",A:"Alpa"}, LET="ABCDE";

var classes=[], activeId=null, tab="ringkasan", date=today();
var mode="local", col=null, showNew=false, compOpen=false, copyText=null;
var qz={view:"list",qid:null,run:null}, pickSt={}, grp=null, rf="", rt="";
var tmr={left:300,run:false,end:0,iv:null};
try{activeId=localStorage.getItem("bk:active")}catch(e){}

/* ---------- penyimpanan ---------- */
var timers={}, busy={}, again={};
function setStatus(st,code){
  var el=$("#status"); el.dataset.state=st;
  if(st==="saving") el.textContent="Menyimpan…";
  else if(st==="error") el.textContent=code==="quota_exceeded"?"Penyimpanan penuh":"Gagal menyimpan, coba lagi";
  else if(st==="loading") el.textContent="Memuat…";
  else el.textContent=mode==="cloud"?"Tersimpan di akun Anda":"Tersimpan di perangkat ini saja";
}
function persist(cls){
  setStatus("saving"); clearTimeout(timers[cls.id]);
  timers[cls.id]=setTimeout(function(){flush(cls.id)},500);
}
async function flush(id){
  var cls=classes.find(function(c){return c.id===id}); if(!cls) return;
  if(busy[id]){again[id]=true;return}
  busy[id]=true;
  try{
    var body=JSON.parse(JSON.stringify(cls));
    if(mode==="cloud") await col.doc(id).set(body);
    else localStorage.setItem("bk:c:"+id,JSON.stringify(body));
    setStatus("saved");
  }catch(e){ setStatus("error",e&&e.code) }
  busy[id]=false;
  if(again[id]){again[id]=false;flush(id)}
}
async function removeStored(id){
  try{ if(mode==="cloud") await col.doc(id).delete(); else localStorage.removeItem("bk:c:"+id) }catch(e){ setStatus("error") }
}
function normalize(c){
  c.students=c.students||[]; c.att=c.att||{}; c.grades=c.grades||{}; c.notes=c.notes||{};
  c.components=c.components||[]; c.kkm=typeof c.kkm==="number"?c.kkm:75; c.created=c.created||0;
  c.quizzes=c.quizzes||[]; c.agenda=c.agenda||[]; c.tahun=c.tahun||"";
  c.quizzes.forEach(function(q){q.questions=q.questions||[];q.results=q.results||{}});
  return c;
}
function loadLocal(){
  var out=[];
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf("bk:c:")===0){ try{out.push(normalize(JSON.parse(localStorage.getItem(k))))}catch(e){} }
    }
  }catch(e){}
  return out;
}

/* ---------- model ---------- */
function newClass(name){
  return normalize({id:uid("c_"),name:name,created:Date.now(),kkm:75,
    components:[{id:"k1",name:"Tugas",w:20},{id:"k2",name:"Ulangan Harian",w:20},{id:"k3",name:"UTS",w:25},{id:"k4",name:"UAS",w:35}]});
}
function newQuestion(){return {id:uid("q"),text:"",opts:["","","",""],ans:-1}}
function makeSample(){
  var c=newClass("7A Matematika (contoh)"); c.tahun="2026/2027 Ganjil";
  var names=["Aulia Rahma","Bima Saputra","Citra Lestari","Dimas Pratama","Eka Putri","Fajar Nugroho","Gita Maharani","Hendra Wijaya"];
  var sc=[[85,80,78,82],[70,65,72,68],[92,90,88,94],[60,70,55,62],[78,82,80,76],[88,85,90,87],[66,72,70,64],[95,92,89,91]];
  c.students=names.map(function(n){return {id:uid("s"),name:n}});
  c.students.forEach(function(s,i){c.grades[s.id]={};c.components.forEach(function(k,j){c.grades[s.id][k.id]=sc[i][j]})});
  delete c.grades[c.students[3].id].k4;
  c.notes[c.students[3].id]="Perlu pendampingan di materi pecahan.";
  [-2,-1,0].forEach(function(n){
    var d=addDays(today(),n); c.att[d]={};
    c.students.forEach(function(s,i){
      c.att[d][s.id]=(i+n+10)%7===0?"S":(i*3+n+10)%11===0?"A":(i+n+10)%13===0?"I":"H";
    });
  });
  var qs=parseQuestions("1. Hasil dari 3/4 + 1/4 adalah...\nA. 1/2\nB. 1\nC. 4/8\nD. 2\nJawaban: B\n\n2. Bilangan prima terkecil adalah...\nA. 0\nB. 1\nC. 2\nD. 3\nJawaban: C\n\n3. Luas persegi dengan sisi 6 cm adalah...\nA. 12 cm2\nB. 24 cm2\nC. 36 cm2\nD. 48 cm2\nJawaban: C");
  c.quizzes.push({id:uid("z"),title:"Kuis Pecahan dan Bangun Datar",shuffle:true,created:Date.now(),questions:qs,results:{}});
  c.agenda.push({id:uid("g"),text:"Ulangan harian Bab 3",date:addDays(today(),5),done:false});
  c.agenda.push({id:uid("g"),text:"Kumpulkan nilai tugas ke wali kelas",date:addDays(today(),-1),done:false});
  return c;
}
function parseQuestions(txt){
  var blocks=String(txt).replace(/\r/g,"").split(/\n\s*\n/), out=[];
  blocks.forEach(function(b){
    var lines=b.split("\n").map(function(s){return s.trim()}).filter(Boolean); if(!lines.length) return;
    var q={id:uid("q"),text:"",opts:["","","",""],ans:-1}, cur="t";
    lines.forEach(function(l){
      var m=l.match(/^(?:jawaban|kunci|answer|ans)\s*[:=\-]?\s*([a-e])\b/i);
      if(m){ q.ans="abcde".indexOf(m[1].toLowerCase()); cur="x"; return; }
      m=l.match(/^\(?([a-e])[\.\)]\s*(.+)$/i);
      if(m&&cur!=="x"){
        var i="abcde".indexOf(m[1].toLowerCase());
        while(q.opts.length<=i) q.opts.push("");
        q.opts[i]=m[2].trim(); cur="o"+i; return;
      }
      if(cur==="t") q.text+=(q.text?" ":"")+l.replace(/^\d+\s*[\.\)]\s*/,"");
      else if(cur.charAt(0)==="o") q.opts[+cur.slice(1)]+=" "+l;
    });
    if(q.text&&q.opts.filter(Boolean).length>=2) out.push(q);
  });
  return out;
}
function cur(){return classes.find(function(c){return c.id===activeId})}
function curQuiz(cls){return cls&&cls.quizzes.find(function(q){return q.id===qz.qid})}
function quizProblem(q){
  if(!q.questions.length) return "Belum ada soal.";
  for(var i=0;i<q.questions.length;i++){
    var s=q.questions[i];
    if(!s.text.trim()) return "Soal "+(i+1)+" belum ada teksnya.";
    if(s.opts.filter(function(o){return o.trim()}).length<2) return "Soal "+(i+1)+" perlu minimal dua pilihan.";
    if(s.ans<0||!(s.opts[s.ans]||"").trim()) return "Soal "+(i+1)+" belum punya kunci jawaban.";
  }
  return "";
}
function finalOf(cls,sid){
  var g=cls.grades[sid]||{}, tw=0, sum=0, filled=0;
  cls.components.forEach(function(k){
    var w=+k.w||0; tw+=w; var v=g[k.id];
    if(typeof v==="number"){filled++;sum+=v*w}
  });
  if(!tw||!filled) return {v:null,miss:cls.components.length};
  return {v:sum/tw,miss:cls.components.length-filled};
}
function inRange(d){return (!rf||d>=rf)&&(!rt||d<=rt)}
function attOf(cls,sid,ranged){
  var r={H:0,S:0,I:0,A:0};
  Object.keys(cls.att).forEach(function(d){
    if(ranged&&!inRange(d)) return;
    var c=cls.att[d][sid]; if(c&&r[c]!==undefined) r[c]++;
  });
  var t=r.H+r.S+r.I+r.A; r.t=t; r.pct=t?r.H/t*100:null; return r;
}
function monthRange(off){
  var d=new Date(), s=new Date(d.getFullYear(),d.getMonth()+off,1), e=new Date(d.getFullYear(),d.getMonth()+off+1,0);
  return [fmtDate(s),fmtDate(e)];
}

/* Ringkasan */
function ringkasanHTML(cls){
  var t=today(), day=cls.att[t]||{}, c={H:0,S:0,I:0,A:0,N:0};
  cls.students.forEach(function(s){var x=day[s.id]; if(x) c[x]++; else c.N++});
  var vals=[]; cls.students.forEach(function(s){var f=finalOf(cls,s.id); if(f.v!=null) vals.push(f.v)});
  var avg=vals.length?vals.reduce(function(a,b){return a+b},0)/vals.length:null;
  var days=Object.keys(cls.att).length;
  var alert=[];
  cls.students.forEach(function(s){
    var a=attOf(cls,s.id,false), f=finalOf(cls,s.id), why=[];
    if(a.t>=3&&a.pct<75) why.push("Kehadiran "+n1(a.pct)+"%");
    if(a.A>=3) why.push("Alpa "+a.A+" kali");
    if(f.v!=null&&f.v<cls.kkm) why.push("Nilai "+n1(f.v)+" di bawah KKM");
    if(why.length) alert.push({s:s,why:why});
  });
  var h='<div class="stats"><div class="stat"><b>'+cls.students.length+'</b><span>Siswa</span></div>'+
    '<div class="stat"><b>'+(cls.students.length?(c.H+" / "+cls.students.length):"–")+'</b><span>Hadir hari ini'+(c.N&&cls.students.length?' ('+c.N+' belum diisi)':'')+'</span></div>'+
    '<div class="stat"><b>'+n1(avg)+'</b><span>Rata-rata nilai</span></div>'+
    '<div class="stat"><b>'+days+'</b><span>Hari tercatat</span></div></div>';
  if(!cls.students.length) h+='<div class="card empty"><h2>Mulai dari daftar siswa</h2><p>Tempel nama siswa dulu agar absensi, nilai, dan kuis bisa dipakai.</p><button class="btn primary" data-act="tab" data-tab="siswa">Tambah siswa</button></div>';
  else{
    h+='<div class="card"><h2>Perlu perhatian</h2>';
    if(alert.length) h+='<div class="list">'+alert.map(function(a){
      return '<div class="rowline"><span class="grow"><b>'+esc(a.s.name)+'</b></span><span>'+a.why.map(function(w){return '<span class="tag wn">'+esc(w)+'</span> '}).join("")+'</span></div>';
    }).join("")+'</div>';
    else h+='<p class="muted" style="margin:0">Tidak ada siswa yang perlu ditindaklanjuti. Daftar ini muncul bila kehadiran di bawah 75%, alpa tiga kali atau lebih, atau nilai di bawah KKM.</p>';
    h+='</div>';
  }
  var ag=cls.agenda.slice().sort(function(a,b){return (a.done-b.done)||((a.date||"9999")<(b.date||"9999")?-1:1)});
  h+='<div class="card"><h2>Agenda dan tugas</h2><div class="inline-form"><input type="text" id="agtext" maxlength="120" placeholder="Mis. Ulangan harian Bab 3" aria-label="Agenda baru">'+
    '<input type="date" id="agdate" aria-label="Tanggal agenda"><button class="btn primary" data-act="add-agenda">Tambah</button></div>'+
    (ag.length?'<div class="list">'+ag.map(function(a){
      var late=!a.done&&a.date&&a.date<t;
      return '<div class="rowline'+(a.done?' done':'')+'"><input type="checkbox" class="check" data-f="agdone" data-id="'+esc(a.id)+'"'+(a.done?' checked':'')+' aria-label="Selesai">'+
        '<span class="grow">'+esc(a.text)+'</span>'+(a.date?'<span class="tag '+(late?'no':'mu')+'">'+(late?'Terlambat · ':'')+esc(shortDate(a.date))+'</span>':'')+
        '<button class="btn small danger" data-act="del-agenda" data-id="'+esc(a.id)+'">Hapus</button></div>';
    }).join("")+'</div>':'<p class="muted" style="margin:0">Belum ada agenda. Catat ulangan, batas pengumpulan tugas, atau rapat di sini.</p>')+'</div>';
  return h;
}

/* Nilai */
function statsHTML(cls){
  var vals=[], ok=0;
  cls.students.forEach(function(s){var f=finalOf(cls,s.id); if(f.v!=null){vals.push(f.v); if(f.v>=cls.kkm) ok++}});
  var avg=vals.length?vals.reduce(function(a,b){return a+b},0)/vals.length:null;
  return '<div class="stat"><b>'+n1(avg)+'</b><span>Rata-rata kelas</span></div>'+
    '<div class="stat"><b>'+n1(vals.length?Math.max.apply(null,vals):null)+'</b><span>Tertinggi</span></div>'+
    '<div class="stat"><b>'+n1(vals.length?Math.min.apply(null,vals):null)+'</b><span>Terendah</span></div>'+
    '<div class="stat"><b>'+ok+' / '+vals.length+'</b><span>Tuntas (KKM '+n1(cls.kkm)+')</span></div>';
}
function finalCells(cls,sid){
  var f=finalOf(cls,sid);
  if(f.v==null) return {a:'<span class="muted">–</span>',b:''};
  return {a:'<span class="final'+(f.miss?' partial':'')+'" title="'+(f.miss?'Belum semua komponen terisi; yang kosong dihitung 0':'')+'">'+n1(f.v)+(f.miss?'*':'')+'</span>',b:tagFor(cls,f.v)};
}
function nilaiHTML(cls){
  if(!cls.students.length) return needStudents(cls);
  var tw=cls.components.reduce(function(a,k){return a+(+k.w||0)},0);
  var ed='<details class="card" id="compbox"'+(compOpen?' open':'')+'><summary>Atur komponen nilai dan KKM</summary>'+
    cls.components.map(function(k){
      return '<div class="comp"><input type="text" value="'+esc(k.name)+'" data-f="cname" data-cid="'+esc(k.id)+'" aria-label="Nama komponen">'+
        '<input type="number" min="0" max="100" value="'+esc(k.w)+'" data-f="cw" data-cid="'+esc(k.id)+'" aria-label="Bobot persen">'+
        '<button class="btn danger" data-act="del-comp" data-cid="'+esc(k.id)+'" aria-label="Hapus komponen">Hapus</button></div>';
    }).join("")+
    '<div class="actions"><button class="btn" data-act="add-comp">+ Komponen</button></div>'+
    '<p style="margin:0">Total bobot: <span class="'+(tw===100?'okc':'warn')+'">'+tw+'%</span>'+(tw===100?'':' (idealnya 100%; nilai akhir tetap dihitung proporsional)')+'</p>'+
    '<div class="field"><label for="kkm">KKM</label><input type="number" id="kkm" min="0" max="100" value="'+esc(cls.kkm)+'" data-f="kkm" style="width:90px"></div></details>';
  var head='<tr><th class="sticky">Nama</th>'+cls.components.map(function(k){
    return '<th class="num">'+esc(k.name)+'<small>'+esc(k.w)+'%</small></th>';
  }).join("")+'<th class="num">Akhir</th><th>Ket.</th></tr>';
  var rows=cls.students.map(function(s){
    var g=cls.grades[s.id]||{}, fc=finalCells(cls,s.id);
    return '<tr><td class="sticky">'+esc(s.name)+'</td>'+cls.components.map(function(k){
      return '<td class="num"><input type="number" inputmode="decimal" min="0" max="100" step="any" data-g="1" data-sid="'+esc(s.id)+'" data-cid="'+esc(k.id)+'" value="'+(typeof g[k.id]==="number"?g[k.id]:"")+'" aria-label="'+esc(k.name)+' '+esc(s.name)+'"></td>';
    }).join("")+'<td class="num" data-fa>'+fc.a+'</td><td data-fb>'+fc.b+'</td></tr>';
  }).join("");
  return '<div class="stats" id="stats">'+statsHTML(cls)+'</div>'+ed+
    '<div class="tablewrap"><table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>'+
    '<p class="legend">Nilai akhir = jumlah (nilai × bobot) dibagi total bobot. Tanda * berarti ada komponen yang masih kosong dan dihitung 0. Skor kuis bisa dimasukkan otomatis dari tab Kuis.</p>';
}

/* Kuis */
function kuisHTML(cls){
  if(qz.view!=="list"&&!curQuiz(cls)) qz={view:"list",qid:null,run:null};
  if(qz.view==="edit") return quizEditHTML(cls);
  if(qz.view==="run") return quizRunHTML(cls);
  if(qz.view==="result") return quizResultHTML(cls);
  return quizListHTML(cls);
}
function quizListHTML(cls){
  var h='<div class="card"><div class="qhead"><div><h2>Kuis</h2><p class="qmeta">Buat soal pilihan ganda, biarkan siswa mengerjakan di perangkat ini, lalu masukkan skornya ke nilai.</p></div>'+
    '<button class="btn primary" data-act="new-quiz">+ Kuis baru</button></div></div>';
  if(!cls.quizzes.length) return h+'<div class="card empty"><h3>Belum ada kuis</h3><p>Ketuk Kuis baru, lalu ketik soal satu per satu atau tempel banyak soal sekaligus dari Word atau catatan Anda.</p></div>';
  return h+cls.quizzes.map(function(q){
    var prob=quizProblem(q), done=Object.keys(q.results).length;
    var canRun=!prob&&cls.students.length;
    return '<div class="card"><div class="qhead"><div><h3>'+esc(q.title)+'</h3><p class="qmeta">'+q.questions.length+' soal · '+done+' dari '+cls.students.length+' siswa sudah mengerjakan'+(q.shuffle?' · soal diacak':'')+'</p></div></div>'+
      (prob?'<p class="warn" style="margin:0">'+esc(prob)+'</p>':'')+
      (!cls.students.length?'<p class="warn" style="margin:0">Tambahkan siswa dulu agar kuis bisa dikerjakan.</p>':'')+
      '<div class="actions"><button class="btn primary" data-act="run-quiz" data-id="'+esc(q.id)+'"'+(canRun?'':' disabled')+'>Kerjakan</button>'+
      '<button class="btn" data-act="result-quiz" data-id="'+esc(q.id)+'">Hasil</button>'+
      '<button class="btn" data-act="edit-quiz" data-id="'+esc(q.id)+'">Edit</button>'+
      '<button class="btn danger" data-act="del-quiz" data-id="'+esc(q.id)+'">Hapus</button></div></div>';
  }).join("");
}
function quizEditHTML(cls){
  var q=curQuiz(cls), prob=quizProblem(q);
  var h='<div class="card"><div class="actions"><button class="btn" data-act="quiz-list">‹ Daftar kuis</button></div>'+
    '<div class="field"><label for="qtitle">Judul kuis</label><input type="text" id="qtitle" value="'+esc(q.title)+'" data-f="qtitle" maxlength="80" style="flex:1 1 220px"></div>'+
    '<div class="field"><input type="checkbox" class="check" id="qshuffle" data-f="qshuffle"'+(q.shuffle?' checked':'')+'><label for="qshuffle" style="font-weight:500">Acak urutan soal dan pilihan jawaban tiap siswa</label></div>'+
    '<p id="qstat" class="'+(prob?'warn':'okc')+'" style="margin:0">'+esc(prob||"Kuis siap dikerjakan.")+'</p></div>';
  h+=q.questions.map(function(s,i){
    var opts=s.opts.slice(); while(opts.length<4) opts.push("");

      '<textarea data-f="qtext" data-qid="'+esc(s.id)+'" aria-label="Teks soal '+(i+1)+'" placeholder="Tulis pertanyaan di sini" style="min-height:70px">'+esc(s.text)+'</textarea>'+
      '<p class="legend">Isi pilihan jawaban lalu tandai bulatan di depan jawaban yang benar.</p>'+
      opts.map(function(o,oi){
        return '<div class="optrow"><input type="radio" name="ans-'+esc(s.id)+'" data-f="qans" data-qid="'+esc(s.id)+'" data-oi="'+oi+'"'+(s.ans===oi?' checked':'')+' aria-label="Jawaban benar '+LET.charAt(oi)+'">'+
          '<span class="L">'+LET.charAt(oi)+'</span><input type="text" value="'+esc(o)+'" data-f="qopt" data-qid="'+esc(s.id)+'" data-oi="'+oi+'" aria-label="Pilihan '+LET.charAt(oi)+'"></div>';
      }).join("")+'</div>';
  }).join("");
  h+='<div class="actions"><button class="btn primary" data-act="add-q">+ Tambah soal</button></div>'+
    '<details class="card"><summary>Tempel banyak soal sekaligus</summary>'+
    '<p class="legend">Pisahkan tiap soal dengan satu baris kosong. Tulis pilihan sebagai A. B. C. D. dan akhiri dengan baris “Jawaban: B”.</p>'+
    '<textarea id="qbulk" placeholder="1. Ibu kota Indonesia adalah...&#10;A. Bandung&#10;B. Jakarta&#10;C. Surabaya&#10;D. Medan&#10;Jawaban: B" style="min-height:160px"></textarea>'+

function refreshQStat(q){
  var el=$("#qstat"); if(!el) return;
  var prob=quizProblem(q); el.className=prob?"warn":"okc"; el.textContent=prob||"Kuis siap dikerjakan.";
}
function quizRunHTML(cls){
  var q=curQuiz(cls), r=qz.run;
  var back='<div class="actions"><button class="btn" data-act="quiz-list">‹ Keluar dari kuis</button></div>';
  if(!r.sid){
    return '<div class="card"><h2>'+esc(q.title)+'</h2><p class="qmeta">'+q.questions.length+' soal. Serahkan perangkat ini kepada siswa, lalu minta ia memilih namanya.</p>'+
      '<div class="field"><label for="runsid">Nama siswa</label><select id="runsid">'+cls.students.map(function(s){
        return '<option value="'+esc(s.id)+'">'+esc(s.name)+(q.results[s.id]?' (sudah mengerjakan)':'')+'</option>';
      }).join("")+'</select></div>'+
      '<p class="legend">Memilih siswa yang sudah mengerjakan akan menimpa hasil sebelumnya.</p>'+
      '<div class="actions"><button class="btn primary" data-act="run-start">Mulai</button></div></div>'+back;
  }
  var stu=cls.students.find(function(s){return s.id===r.sid});
  if(r.done){
    var res=q.results[r.sid];
    return '<div class="card empty"><h2>Terima kasih, '+esc(stu?stu.name:"")+'</h2><p>Kuis selesai. Nilai Anda:</p><div class="bigscore">'+n1(res.s)+'</div>'+
      '<p>'+res.ok+' dari '+res.n+' soal benar.</p>'+
      '<div class="actions"><button class="btn primary" data-act="run-next">Siswa berikutnya</button><button class="btn" data-act="result-quiz" data-id="'+esc(q.id)+'">Lihat hasil kelas</button></div></div>';
  }
  var qid=r.order[r.i], s=q.questions.find(function(x){return x.id===qid}), chosen=r.ans[qid];
  var oo=r.oo[qid];
  return '<div class="card"><div class="qhead"><span class="muted">'+esc(stu?stu.name:"")+'</span><span class="muted">Soal '+(r.i+1)+' dari '+r.order.length+'</span></div>'+
    '<div class="bar"><i style="width:'+Math.round((r.i+(chosen!==undefined?1:0))/r.order.length*100)+'%"></i></div>'+
    '<p class="qtext">'+esc(s.text)+'</p>'+
    oo.map(function(oi,pos){
      return '<button class="optbtn" data-act="pick-opt" data-oi="'+oi+'" aria-pressed="'+(chosen===oi)+'"><span class="L">'+LET.charAt(pos)+'</span><span>'+esc(s.opts[oi])+'</span></button>';
    }).join("")+
    '<div class="actions"><button class="btn" data-act="run-prev"'+(r.i===0?' disabled':'')+'>‹ Sebelumnya</button>'+
    (r.i<r.order.length-1?'<button class="btn primary" data-act="run-fwd">Lanjut ›</button>':'<button class="btn primary" data-act="run-finish">Selesai</button>')+'</div></div>';
}
function quizResultHTML(cls){
  var q=curQuiz(cls), sids=Object.keys(q.results).filter(function(id){return cls.students.some(function(s){return s.id===id})});
  var scores=sids.map(function(id){return q.results[id].s});
  var avg=scores.length?scores.reduce(function(a,b){return a+b},0)/scores.length:null;
  var h='<div class="card"><div class="actions"><button class="btn" data-act="quiz-list">‹ Daftar kuis</button></div><h2>Hasil: '+esc(q.title)+'</h2>'+
    '<div class="stats"><div class="stat"><b>'+sids.length+' / '+cls.students.length+'</b><span>Sudah mengerjakan</span></div>'+

function exportTable(cls){

function tmrFmt(s){return pad(Math.floor(s/60))+":"+pad(s%60)}

function tmrStop(){clearInterval(tmr.iv); tmr.iv=null; tmr.run=false}
function beep(){
  try{
    var ac=new (window.AudioContext||window.webkitAudioContext)(), o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination); o.frequency.value=880; g.gain.value=.12; o.start();
    setTimeout(function(){o.stop();ac.close()},800);
  }catch(e){}
}
function tmrStart(){
  if(tmr.run||tmr.left<=0) return;
  tmr.run=true; tmr.end=Date.now()+tmr.left*1000;
  tmr.iv=setInterval(function(){
    tmr.left=(tmr.end-Date.now())/1000;
    if(tmr.left<=0){tmr.left=0; tmrStop(); beep(); toast("Waktu habis"); if(tab==="alat") renderPanel(); return}
    tmrDraw();

}

var undoFn=null;

  toast.t=setTimeout(function(){t.hidden=true;undoFn=null},undo?9000:2600);
}

function setActive(id){activeId=id; try{localStorage.setItem("bk:active",id)}catch(e){}}
function createClass(name){

  var c=newClass(name); classes.push(c); setActive(c.id); showNew=false; tab="siswa"; persist(c); render();

function parseNames(txt){

async function getDownloads(){
  try{ return await window.claude.use("downloads") }catch(e){ return null }
}
async function saveFile(name,data){
  var dl=await getDownloads();
  if(!dl){toast("Unduhan tidak tersedia di sini. Gunakan Salin untuk Excel.");return}
  try{ await dl.save({filename:name,data:data}) }
  catch(err){ if(!err||err.code!=="declined") toast("Unduhan gagal. Coba lagi.") }
}
function slug(s){return String(s).replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")||"kelas"}

document.addEventListener("click",async function(e){
  var b=e.target.closest("[data-act]"); if(!b) return;

      q.questions.forEach(function(x){ if(r.ans[x.id]===x.ans) ok++ });
      q.results[r.sid]={a:r.ans,s:Math.round((total?ok/total*100:0)*10)/10,ok:ok,n:total,t:Date.now()};
      r.done=true; persist(cls); renderPanel(); break;
    case "run-next": qz.run={sid:null}; renderPanel(); break;
    case "del-result":
      var rsid=b.dataset.sid, old=q.results[rsid]; delete q.results[rsid]; persist(cls); renderPanel();
      toast("Hasil dihapus",function(){q.results[rsid]=old; persist(cls); renderPanel()}); break;
    case "push-score":
      var cid=$("#tgt").value, cnt=0;
      Object.keys(q.results).forEach(function(sid2){
        if(!cls.students.some(function(x){return x.id===sid2})) return;
        (cls.grades[sid2]||(cls.grades[sid2]={}))[cid]=q.results[sid2].s; cnt++;
      });
      persist(cls); toast("Skor "+cnt+" siswa dimasukkan ke tab Nilai."); break;
    /* alat */
    case "pick-random":
      var ps=pickSt[cls.id]||(pickSt[cls.id]={pool:null,cur:null});
      ps.pool=(ps.pool||[]).filter(function(id){return cls.students.some(function(x){return x.id===id})});
      if(!ps.pool.length&&!ps.fresh){ps.pool=cls.students.map(function(x){return x.id})}
      if(!ps.pool.length){ps.pool=cls.students.map(function(x){return x.id})}
      var pi=Math.floor(Math.random()*ps.pool.length); ps.cur=ps.pool.splice(pi,1)[0]; ps.fresh=true; renderPanel(); break;
    case "pick-reset": pickSt[cls.id]={pool:cls.students.map(function(x){return x.id}),cur:null,fresh:true}; renderPanel(); break;
    case "make-groups":
      var n=Math.max(2,Math.min(20,parseInt($("#gn").value,10)||4)); n=Math.min(n,cls.students.length);
      var sh=shuffle(cls.students.map(function(x){return x.name})); grp=[]; for(var gi=0;gi<n;gi++) grp.push([]);
      sh.forEach(function(nm,i){grp[i%n].push(nm)}); renderPanel(); break;
    case "copy-groups":
      var gt=grp.map(function(g,i){return "Kelompok "+(i+1)+"\n"+g.map(function(x){return "- "+x}).join("\n")}).join("\n\n");
      try{ await navigator.clipboard.writeText(gt); toast("Pembagian kelompok disalin.") }catch(err){ toast("Tidak bisa menyalin otomatis. Catat dari layar.") } break;
    case "tmr-set": tmrStop(); tmr.left=+b.dataset.m*60; renderPanel(); break;
    case "tmr-start": tmrStart(); renderPanel(); break;
    case "tmr-pause": tmr.left=Math.max(0,(tmr.end-Date.now())/1000); tmrStop(); renderPanel(); break;
    case "tmr-reset": tmrStop(); tmr.left=300; renderPanel(); break;
    case "backup":
      await saveFile("cadangan-buku-kelas-"+today()+".json",JSON.stringify({app:"bukukelas",v:2,exported:new Date().toISOString(),classes:classes})); break;
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="newname"){e.preventDefault();createClass(e.target.value)}
  if(e.key==="Enter"&&e.target.id==="agtext"){e.preventDefault();var bt=$('[data-act="add-agenda"]'); if(bt) bt.click()}
});
document.addEventListener("change",async function(e){
  var t=e.target;
  if(t.id==="restore"){
    var file=t.files&&t.files[0]; if(!file) return;
    try{
      var data=JSON.parse(await file.text());
      if(!data||data.app!=="bukukelas"||!Array.isArray(data.classes)) throw new Error("format");
      data.classes.forEach(function(c){
        c=normalize(c); if(!c.id) return;
        var i=classes.findIndex(function(x){return x.id===c.id}); if(i>=0) classes[i]=c; else classes.push(c);
        persist(c);
      });
      classes.sort(function(a,b){return (a.created||0)-(b.created||0)});
      if(!cur()) setActive(classes[0].id);
      render(); toast(data.classes.length+" kelas dipulihkan.");
    }catch(err){ toast("File cadangan tidak bisa dibaca.") }
    t.value=""; return;
  }
  var cls=cur(); if(!cls) return;
  if(t.id==="dt"){ if(/^\d{4}-\d{2}-\d{2}$/.test(t.value)){date=t.value; renderPanel()} return; }
  if(t.id==="rf"||t.id==="rt"){ if(t.id==="rf") rf=t.value; else rt=t.value; renderPanel(); return; }
  var f=t.dataset&&t.dataset.f; if(!f) return;
  var q=curQuiz(cls), sq=q&&q.questions.find(function(x){return x.id===t.dataset.qid});
  if(f==="cname"){ cls.components.find(function(k){return k.id===t.dataset.cid}).name=t.value.trim()||"Komponen"; compOpen=true; persist(cls); renderPanel(); }
  else if(f==="cw"){ cls.components.find(function(k){return k.id===t.dataset.cid}).w=clamp(parseFloat(t.value)||0); compOpen=true; persist(cls); renderPanel(); }
  else if(f==="kkm"){ cls.kkm=clamp(parseFloat(t.value)||0); compOpen=true; persist(cls); renderPanel(); }
  else if(f==="sname"){ var s=cls.students.find(function(x){return x.id===t.dataset.sid}); if(s){s.name=t.value.trim()||s.name; persist(cls)} }
  else if(f==="snote"){ var v=t.value.trim(); if(v) cls.notes[t.dataset.sid]=v; else delete cls.notes[t.dataset.sid]; persist(cls); }
  else if(f==="clsname"){ cls.name=t.value.trim()||cls.name; persist(cls); renderClassBar(); }
  else if(f==="tahun"){ cls.tahun=t.value.trim(); persist(cls); }
  else if(f==="agdone"){ var ag=cls.agenda.find(function(a){return a.id===t.dataset.id}); if(ag){ag.done=t.checked; persist(cls); renderPanel()} }
  else if(f==="qtitle"&&q){ q.title=t.value.trim()||"Kuis"; persist(cls); }
  else if(f==="qshuffle"&&q){ q.shuffle=t.checked; persist(cls); }
  else if(f==="qtext"&&sq){ sq.text=t.value; persist(cls); refreshQStat(q); }
  else if(f==="qopt"&&sq){ sq.opts[+t.dataset.oi]=t.value; persist(cls); refreshQStat(q); }
  else if(f==="qans"&&sq){ sq.ans=+t.dataset.oi; persist(cls); renderPanel(); }
});
document.addEventListener("input",function(e){
  var t=e.target; if(!t.dataset||!t.dataset.g) return;
  var cls=cur(); if(!cls) return;
  var g=cls.grades[t.dataset.sid]||(cls.grades[t.dataset.sid]={});
  if(t.value===""||isNaN(parseFloat(t.value))) delete g[t.dataset.cid];
  else g[t.dataset.cid]=clamp(parseFloat(t.value));
  if(!Object.keys(g).length) delete cls.grades[t.dataset.sid];
  var tr=t.closest("tr"), fc=finalCells(cls,t.dataset.sid);
  tr.querySelector("[data-fa]").innerHTML=fc.a; tr.querySelector("[data-fb]").innerHTML=fc.b;
  $("#stats").innerHTML=statsHTML(cls);
  persist(cls);
});
document.addEventListener("toggle",function(e){ if(e.target.id==="compbox") compOpen=e.target.open },true);

/* ---------- mulai ---------- */
async function init(){
  var db=null, user=null, uidv=null;
  try{
    if(window.claude&&window.claude.use){
      var r=await Promise.all([window.claude.use("db"),window.claude.use("user")]); db=r[0]; user=r[1];
    }
    if(db&&user) uidv=await user.id();
  }catch(e){}
  if(db&&uidv){
    try{
      col=db.collection("data/users/"+uidv);
      var snap=await col.get();
      classes=snap.docs.map(function(d){return normalize(d.data())}).filter(function(c){return c&&c.id});
      mode="cloud";
    }catch(e){ mode="local"; col=null; }
  }
  if(mode==="local") classes=loadLocal();
  classes.sort(function(a,b){return (a.created||0)-(b.created||0)});
  if(!classes.some(function(c){return c.id===activeId})) activeId=classes.length?classes[0].id:null;
  setStatus("saved"); render();
}
init();
})();
</script>
